[project]
name = "shopping"
version = "0.1.0"
description = "A recipe & shopping list app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1,<4",
]

[project.optional-dependencies]
# Production WSGI server, used by the container image. Not needed for local dev,
# where main.py runs Flask's own server.
prod = [
    "gunicorn>=23.0,<24",
]

[project.scripts]
shopping = "src.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"
